name: OMC Sovereign Sync

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  sovereign-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --prefer-offline 2>/dev/null || npm install

      # ── Stage 1: Luau syntax check (all contributors) ─────────────────────
      - name: 🔍 Luau Syntax Check
        id: luau
        run: |
          ERRORS=0
          while IFS= read -r file; do
            # Use node to do a basic parse check — looks for common Luau errors
            if python3 -c "
import re, sys
content = open('$file').read()
# Flag obvious syntax killers
if re.search(r'^-\s*$', content, re.MULTILINE):
    print(f'SYNTAX ERROR in $file: bare dash on line')
    sys.exit(1)
" 2>/dev/null; then
              :
            else
              echo "❌ Syntax issue: $file"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find src/ generated/ -name "*.luau" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            echo "luau_ok=false" >> $GITHUB_OUTPUT
            echo "luau_errors=$ERRORS" >> $GITHUB_OUTPUT
          else
            echo "luau_ok=true" >> $GITHUB_OUTPUT
            echo "luau_errors=0" >> $GITHUB_OUTPUT
          fi

      # ── Stage 2: Bridge verification gate (all pushes/PRs) ─────────────────
      - name: 🛡️ Governance Gate (Bridge Modules)
        id: governance
        run: |
          echo "bridge_changed=true" >> $GITHUB_OUTPUT
          cd server/bridge
          npm install --prefer-offline 2>/dev/null || npm install
          npm run typecheck && npm run verify:bridge \
            && echo "bridge_ok=true" >> $GITHUB_OUTPUT \
            || echo "bridge_ok=false" >> $GITHUB_OUTPUT

      # ── Stage 3: Auto open PR if push to feature branch ───────────────────
      - name: 📬 Auto-Open PR
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const commit = context.payload.head_commit;
            const message = commit ? commit.message : 'Sovereign update';
            const firstLine = message.split('\n')[0];

            // Check if PR already exists
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: firstLine,
                body: [
                  '## Sovereign Submit',
                  '',
                  `**Branch:** \`${branch}\``,
                  `**Author:** ${commit?.author?.name || 'contributor'}`,
                  '',
                  '### CI Status',
                  '- Luau syntax check: running',
                  '- Bridge verification harness: running',
                  '',
                  '### Merge Criteria',
                  '- ✅ Luau syntax clean',
                  '- ✅ Bridge typecheck + verify:bridge pass',
                  '',
                  '_Auto-generated by OMC Sovereign Sync_'
                ].join('\n'),
                head: branch,
                base: 'main',
                draft: false
              });
            }

      # ── Stage 4: Comment results on PR ────────────────────────────────────
      - name: 📋 Report Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const luauOk = '${{ steps.luau.outputs.luau_ok }}' === 'true';
            const bridgeOk = '${{ steps.governance.outputs.bridge_ok }}' === 'true';
            const bridgeChanged = '${{ steps.governance.outputs.bridge_changed }}' === 'true';
            const luauErrors = '${{ steps.luau.outputs.luau_errors }}';

            const status = (luauOk && bridgeOk) ? '✅ CLEARED FOR MERGE' : '🛑 NEEDS FIXES';

            const body = [
              `## OMC Sovereign Gate — ${status}`,
              '',
              `| Check | Result |`,
              `|-------|--------|`,
              `| Luau Syntax | ${luauOk ? '✅ Clean' : `❌ ${luauErrors} error(s)`} |`,
              `| Bridge Verification | ${bridgeChanged ? (bridgeOk ? '✅ Pass' : '❌ Fail') : '⏭️ Not changed'} |`,
              '',
              luauOk && bridgeOk
                ? '**All gates passed. Ready to merge.**'
                : '**Fix the issues above, then push again. The gate re-runs automatically.**'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # ── Stage 5: Fail the run if any gate is red ──────────────────────────
      - name: 🚦 Gate Decision
        run: |
          LUAU_OK="${{ steps.luau.outputs.luau_ok }}"
          BRIDGE_OK="${{ steps.governance.outputs.bridge_ok }}"

          if [ "$LUAU_OK" != "true" ] || [ "$BRIDGE_OK" != "true" ]; then
            echo "❌ Gate failed. Fix issues and re-push."
            exit 1
          fi
          echo "✅ All gates passed."
