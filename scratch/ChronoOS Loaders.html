<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChronoOS — Loader Concepts</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #07070b;
    --teal: #2dd4bf;
    --teal-deep: #0d3d3d;
    --coral: #ff5a4e;
    --cold: #0891b2;
    --cold-deep: #1e3a8a;
    --amber: #fbbf24;
    --slate: #94a3b8;
    --slate-dim: #475569;
    --slate-deeper: #1e293b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--slate);
    font-family: "JetBrains Mono", "SF Mono", "Menlo", monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
  }
  body {
    padding: 32px;
    min-height: 100vh;
  }
  header {
    max-width: 1320px;
    margin: 0 auto 28px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--slate-deeper);
    padding-bottom: 16px;
  }
  header h1 {
    font-size: 13px;
    font-weight: 500;
    color: var(--teal);
    margin: 0;
    letter-spacing: 0.18em;
  }
  header .meta {
    font-size: 10px;
    color: var(--slate-dim);
    letter-spacing: 0.18em;
  }
  .grid {
    max-width: 1320px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, 400px);
    gap: 24px;
    justify-content: center;
  }
  .card {
    width: 400px;
  }
  .frame {
    width: 400px;
    height: 400px;
    background: var(--bg);
    border: 1px solid var(--slate-deeper);
    position: relative;
    overflow: hidden;
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(45,212,191,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,212,191,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1px solid var(--slate-dim);
    opacity: 0.6;
  }
  .corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
  .corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }
  .label {
    position: absolute;
    top: 14px;
    left: 24px;
    color: var(--slate-dim);
    font-size: 9px;
    letter-spacing: 0.2em;
  }
  .label .num { color: var(--teal); margin-right: 8px; }
  .status {
    position: absolute;
    bottom: 14px;
    left: 24px;
    right: 24px;
    color: var(--slate-dim);
    font-size: 9px;
    letter-spacing: 0.18em;
    display: flex;
    justify-content: space-between;
  }
  .status .v { color: var(--teal); }
  .caption {
    margin-top: 10px;
    font-size: 10px;
    color: var(--slate);
    letter-spacing: 0.12em;
    display: flex;
    justify-content: space-between;
  }
  .caption .name { color: var(--teal); }
  .caption .meta { color: var(--slate-dim); }

  /* ===================================================== */
  /* #01 SHATTER */
  /* ===================================================== */
  .shatter-stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .shatter-svg { width: 280px; height: 280px; overflow: visible; }
  .shatter-shard {
    fill: #0d3d3d;
    stroke: var(--teal);
    stroke-width: 1;
    transform-origin: 140px 140px;
    transform-box: fill-box;
    animation: shatterCycle 2800ms cubic-bezier(.6,.05,.3,1) infinite;
  }
  .shatter-stress {
    stroke: var(--coral);
    stroke-width: 0.8;
    fill: none;
    opacity: 0;
    animation: shatterStress 2800ms ease-out infinite;
  }
  @keyframes shatterCycle {
    0%,8%   { transform: translate(0,0) rotate(0deg); }
    35%,55% { transform: var(--explode); }
    85%,100%{ transform: translate(0,0) rotate(0deg); }
  }
  @keyframes shatterStress {
    0%,7% { opacity: 0; }
    9%    { opacity: 1; }
    14%   { opacity: 0; }
    100%  { opacity: 0; }
  }

  /* ===================================================== */
  /* #02 SPECTRAL FABRIC */
  /* ===================================================== */
  .fabric {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(12, 1fr);
    padding: 60px;
    gap: 0;
  }
  .fabric .cell {
    display: flex; align-items: center; justify-content: center;
    color: var(--cold-deep);
    font-size: 10px;
    animation: fabricHeat 2400ms linear infinite;
  }
  @keyframes fabricHeat {
    0%, 100% { color: var(--cold-deep); text-shadow: none; }
    45%      { color: var(--teal);     text-shadow: 0 0 4px var(--teal); }
    50%      { color: var(--coral);    text-shadow: 0 0 8px var(--coral); }
    60%      { color: var(--amber);    text-shadow: 0 0 4px var(--amber); }
    80%      { color: var(--cold-deep); text-shadow: none; }
  }

  /* ===================================================== */
  /* #03 ESCROW GATE */
  /* ===================================================== */
  .escrow { position:absolute; inset:0; padding: 60px 80px; }
  .escrow .threshold {
    position: absolute; left: 60px; right: 60px;
    height: 1px;
    background: var(--amber);
    top: 130px;
    box-shadow: 0 0 6px var(--amber);
    opacity: 0.7;
    animation: thresholdFlash 2600ms ease-in-out infinite;
  }
  .escrow .threshold::before {
    content: "THRESHOLD 0.85"; position: absolute;
    right: 0; top: -14px; color: var(--amber); font-size: 9px; letter-spacing: 0.2em;
  }
  .escrow .bars { display: flex; gap: 24px; justify-content: center; height: 100%; padding-top: 50px; padding-bottom: 70px; }
  .escrow .col { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 60px; }
  .escrow .bar-track {
    flex: 1; width: 32px; background: rgba(45,212,191,0.05);
    border: 1px solid var(--teal-deep);
    position: relative; overflow: visible;
  }
  .escrow .bar-fill {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, var(--teal), var(--teal-deep));
    box-shadow: 0 0 12px rgba(45,212,191,0.4);
  }
  .escrow .bar-fill.s1 { animation: barFill1 2600ms cubic-bezier(.4,1.5,.5,1) infinite; }
  .escrow .bar-fill.s2 { animation: barFill2 2600ms cubic-bezier(.4,1.5,.5,1) infinite; }
  .escrow .bar-fill.s3 { animation: barFill3 2600ms cubic-bezier(.4,1.5,.5,1) infinite; }
  .escrow .bar-fill.s3 { background: linear-gradient(180deg, var(--coral), #4a1a16); }
  .escrow .ticker { color: var(--teal); font-size: 10px; margin-top: 6px; }
  .escrow .ticker.breach { color: var(--coral); }
  .escrow .lbl { color: var(--slate-dim); font-size: 8px; letter-spacing: 0.2em; margin-top: 4px; }
  .escrow .bracket {
    position: absolute; left: -8px; right: -8px;
    color: var(--amber); font-size: 14px; font-weight: 700;
    display: flex; justify-content: space-between;
    opacity: 0;
    animation: clamp 2600ms ease-in-out infinite;
  }
  .escrow .col.c3 .bracket { animation: clampBreach 2600ms ease-in-out infinite; color: var(--coral); }

  @keyframes barFill1 {
    0%      { height: 0; }
    50%,80% { height: 55%; }
    95%,100%{ height: 0; }
  }
  @keyframes barFill2 {
    0%      { height: 0; }
    50%,80% { height: 78%; }
    95%,100%{ height: 0; }
  }
  @keyframes barFill3 {
    0%      { height: 0; }
    50%,80% { height: 92%; }
    95%,100%{ height: 0; }
  }
  @keyframes thresholdFlash {
    0%,42%   { opacity: 0.5; background: var(--amber); }
    48%      { opacity: 1; background: var(--coral); box-shadow: 0 0 12px var(--coral); }
    60%,100% { opacity: 0.5; background: var(--amber); }
  }
  @keyframes clamp {
    0%,55%   { opacity: 0; transform: scaleX(1.4); }
    65%,80%  { opacity: 1; transform: scaleX(1); }
    90%,100% { opacity: 0; transform: scaleX(1.4); }
  }
  @keyframes clampBreach {
    0%,48%   { opacity: 0; transform: scaleX(1.4); }
    55%      { opacity: 1; transform: scaleX(1); }
    65%      { opacity: 0.4; }
    72%      { opacity: 1; }
    85%,100% { opacity: 0; transform: scaleX(1.4); }
  }

  /* ===================================================== */
  /* #04 CENTROID */
  /* ===================================================== */
  .centroid { position:absolute; inset:0; }
  .marker {
    position: absolute; width: 12px; height: 12px;
    transform-origin: center;
  }
  .marker::before, .marker::after {
    content:""; position:absolute; background: var(--teal); box-shadow: 0 0 4px var(--teal);
  }
  .marker::before { left: 0; right: 0; top: 50%; height: 1px; margin-top: -0.5px; }
  .marker::after { top: 0; bottom: 0; left: 50%; width: 1px; margin-left: -0.5px; }
  .marker .lbl {
    position: absolute; top: -12px; left: 14px;
    color: var(--slate-dim); font-size: 7px; letter-spacing: 0.1em;
    white-space: nowrap;
  }
  .centroid-core {
    position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; margin: -4px 0 0 -4px;
    background: var(--coral);
    box-shadow: 0 0 0 0 var(--coral);
    border-radius: 50%;
    animation: centroidPulse 2800ms ease-out infinite;
  }
  @keyframes centroidPulse {
    0%,55%   { box-shadow: 0 0 0 0 rgba(255,90,78,0); }
    62%      { box-shadow: 0 0 0 80px rgba(255,90,78,0); background: var(--coral); }
    62.01%   { box-shadow: 0 0 12px 2px var(--coral); }
    65%      { box-shadow: 0 0 0 4px rgba(255,90,78,0.6); }
    80%      { box-shadow: 0 0 0 60px rgba(255,90,78,0); }
    100%     { box-shadow: 0 0 0 0 rgba(255,90,78,0); }
  }

  /* ===================================================== */
  /* #05 ORBIT HEAT */
  /* ===================================================== */
  .orbit-stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .orbit-svg { width: 360px; height: 360px; overflow: visible; }
  .orbit-track {
    fill: none; stroke: var(--teal-deep); stroke-width: 1;
    stroke-dasharray: 3 5; opacity: 0.7;
  }
  .meridian {
    stroke: var(--coral); stroke-width: 0.5; stroke-dasharray: 2 4; opacity: 0.4;
  }
  .orbit-node { transform-origin: 180px 180px; }
  .orbit-node circle.body { fill: var(--cold); }
  .orbit-node text { font-size: 8px; fill: var(--slate); letter-spacing: 0.1em; }
  .o1 { animation: orbit1 2800ms linear infinite; }
  .o2 { animation: orbit2 2200ms linear infinite reverse; }
  .o3 { animation: orbit3 3400ms linear infinite; }
  .o4 { animation: orbit4 2600ms linear infinite reverse; }
  .o5 { animation: orbit5 3000ms linear infinite; }
  @keyframes orbit1 { to { transform: rotate(360deg); } }
  @keyframes orbit2 { to { transform: rotate(360deg); } }
  @keyframes orbit3 { to { transform: rotate(360deg); } }
  @keyframes orbit4 { to { transform: rotate(360deg); } }
  @keyframes orbit5 { to { transform: rotate(360deg); } }

  /* ===================================================== */
  /* #06 LATENCY GRAPH */
  /* ===================================================== */
  .latency { position: absolute; inset: 0; padding: 0 40px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .lat-row { position: relative; }
  .lat-row .axis {
    color: var(--slate-dim); font-size: 8px; letter-spacing: 0.18em;
    display: flex; justify-content: space-between; margin-bottom: 6px;
  }
  .lat-cells {
    display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px;
    height: 28px;
  }
  .lat-cell {
    background: var(--slate-deeper);
    position: relative;
    overflow: hidden;
  }
  .lat-cell::after {
    content:""; position: absolute; inset: 0; background: var(--teal); transform: scaleX(0); transform-origin: left;
    box-shadow: 0 0 6px var(--teal);
  }
  .lat-cells.run .lat-cell::after { animation: latFill 2400ms linear infinite; }
  .lat-cells.run .lat-cell:nth-child(n)::after { animation-delay: calc(var(--i) * 60ms); }
  @keyframes latFill {
    0%, 100% { transform: scaleX(0); opacity: 1; }
    8%       { transform: scaleX(1); opacity: 1; }
    80%      { transform: scaleX(1); opacity: 1; }
    90%      { transform: scaleX(1); opacity: 0; }
  }
  .lat-tot {
    position: absolute; right: 0; top: -4px;
    color: var(--amber); font-size: 11px; letter-spacing: 0.15em;
    opacity: 0;
    animation: latCommit 2400ms ease-in-out infinite;
  }
  @keyframes latCommit {
    0%,75%   { opacity: 0; transform: translateY(0); }
    82%      { opacity: 1; transform: translateY(0); color: var(--amber); }
    92%      { opacity: 1; transform: translateY(-12px); color: var(--teal); }
    98%,100% { opacity: 0; transform: translateY(-20px); }
  }

  /* ===================================================== */
  /* #07 QUADMAP */
  /* ===================================================== */
  .quad { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; }
  .quad-svg { width: 280px; height: 280px; overflow: visible; }
  .quad-svg rect { fill: none; stroke: var(--teal); stroke-width: 1; }
  .quad-svg .leaf { fill: rgba(45,212,191,0.04); }
  .quad-svg .leaf.hot { fill: rgba(255,90,78,0.12); stroke: var(--coral); }
  .quad-svg .leaf.cold { fill: rgba(8,145,178,0.08); stroke: var(--cold); }
  .quad-svg text { font-family: monospace; font-size: 8px; fill: var(--slate); letter-spacing: 0.1em; }
  .quad-svg .split {
    stroke: var(--teal); stroke-width: 0.8;
    stroke-dasharray: 280; stroke-dashoffset: 280;
    animation: drawSplit 3000ms ease-in-out infinite;
  }
  .quad-svg .leaf-anim {
    opacity: 0;
    animation: leafIn 3000ms ease-in-out infinite;
  }
  .quad-svg .leaf-label {
    opacity: 0;
    animation: leafIn 3000ms ease-in-out infinite;
  }
  @keyframes drawSplit {
    0%      { stroke-dashoffset: 280; }
    20%     { stroke-dashoffset: 0; }
    80%     { stroke-dashoffset: 0; opacity: 1; }
    92%     { opacity: 0.2; }
    100%    { stroke-dashoffset: 280; opacity: 0.2; }
  }
  @keyframes leafIn {
    0%, 30%   { opacity: 0; }
    45%, 80%  { opacity: 1; }
    92%, 100% { opacity: 0; }
  }
  .quad-pulse {
    transform-origin: center; transform-box: fill-box;
    animation: quadPulse 3000ms ease-in-out infinite;
  }
  @keyframes quadPulse {
    0%,75%   { filter: drop-shadow(0 0 0 transparent); }
    82%      { filter: drop-shadow(0 0 8px var(--coral)); }
    92%,100% { filter: drop-shadow(0 0 0 transparent); }
  }

  /* ===================================================== */
  /* #08 ZOD FORGE */
  /* ===================================================== */
  .zod { position: absolute; inset: 0; padding: 50px 50px; font-family: inherit; font-size: 11px; line-height: 18px; }
  .zod .ln { display: flex; justify-content: space-between; opacity: 0; }
  .zod .ln .code { color: var(--slate); white-space: pre; }
  .zod .ln .code .k { color: var(--cold); }
  .zod .ln .code .s { color: var(--amber); }
  .zod .ln .vbr { color: var(--amber); font-weight: 700; transition: color .2s; }
  .zod .ln.ok .vbr { color: var(--teal); }
  .zod .l1 { animation: zodLine 3200ms steps(1) infinite; animation-delay: 0ms; }
  .zod .l2 { animation: zodLine 3200ms steps(1) infinite; animation-delay: 200ms; }
  .zod .l3 { animation: zodLine 3200ms steps(1) infinite; animation-delay: 400ms; }
  .zod .l4 { animation: zodLine 3200ms steps(1) infinite; animation-delay: 600ms; }
  .zod .l5 { animation: zodLine 3200ms steps(1) infinite; animation-delay: 800ms; }
  .zod .l6 { animation: zodLine 3200ms steps(1) infinite; animation-delay: 1000ms; }
  @keyframes zodLine {
    0%, 5%    { opacity: 0; }
    8%, 70%   { opacity: 1; }
    /* validating amber, then ok teal handled via class swap below */
    78%,100%  { opacity: 0; }
  }
  .zod .ln .vbr { animation: brackTone 3200ms steps(1) infinite; }
  .zod .l1 .vbr { animation-delay: 100ms; }
  .zod .l2 .vbr { animation-delay: 300ms; }
  .zod .l3 .vbr { animation-delay: 500ms; }
  .zod .l4 .vbr { animation-delay: 700ms; }
  .zod .l5 .vbr { animation-delay: 900ms; }
  .zod .l6 .vbr { animation-delay: 1100ms; }
  @keyframes brackTone {
    0%,15%   { color: var(--amber); }
    25%,70%  { color: var(--teal); }
    78%,100% { color: var(--amber); opacity: 0; }
  }
  .zod .seal {
    position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
    margin: -30px 0 0 -30px;
    border: 1px solid var(--coral);
    transform: scale(0) rotate(0deg);
    background: rgba(255,90,78,0.1);
    box-shadow: 0 0 18px var(--coral);
    opacity: 0;
    animation: zodSeal 3200ms ease-in-out infinite;
  }
  .zod .seal::after {
    content: "✓ SEALED"; position: absolute; inset: 0; display:flex;
    align-items:center; justify-content:center;
    color: var(--coral); font-size: 9px; letter-spacing: 0.2em;
  }
  @keyframes zodSeal {
    0%,75%   { opacity: 0; transform: scale(0) rotate(0deg); }
    80%      { opacity: 1; transform: scale(1) rotate(0deg); }
    92%      { opacity: 1; transform: scale(0.6) rotate(540deg); }
    98%,100% { opacity: 0; transform: scale(0.1) rotate(720deg); }
  }

  /* ===================================================== */
  /* #09 MANHATTAN RESONANCE */
  /* ===================================================== */
  .mhattan { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; }
  .mhattan-svg { width: 320px; height: 320px; overflow: visible; }
  .mhattan-svg .grid line { stroke: var(--slate-deeper); stroke-width: 0.5; }
  .mhattan-svg .src {
    fill: var(--teal); stroke: var(--teal); stroke-width: 0.5;
  }
  .mhattan-svg .srcB { fill: var(--cold); stroke: var(--cold); }
  .mhattan-svg .ring {
    fill: none; stroke-width: 1;
    transform-origin: var(--ox) var(--oy);
    transform-box: fill-box;
  }
  .mhattan-svg .ring.A { stroke: var(--teal); animation: mhRing 2400ms ease-out infinite; }
  .mhattan-svg .ring.B { stroke: var(--cold); animation: mhRing 2400ms ease-out infinite; }
  .mhattan-svg .ring.r1 { animation-delay: 0ms; }
  .mhattan-svg .ring.r2 { animation-delay: 160ms; }
  .mhattan-svg .ring.r3 { animation-delay: 320ms; }
  .mhattan-svg .ring.r4 { animation-delay: 480ms; }
  @keyframes mhRing {
    0%   { transform: scale(0); opacity: 0.9; }
    70%  { transform: scale(2.6); opacity: 0; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .mhattan-svg .hit {
    fill: var(--coral); opacity: 0;
    animation: mhHit 2400ms ease-out infinite;
    animation-delay: 600ms;
  }
  @keyframes mhHit {
    0%,40% { opacity: 0; }
    50%    { opacity: 1; }
    75%    { opacity: 0; }
    100%   { opacity: 0; }
  }
  .mhattan-svg .score {
    fill: var(--amber); font-size: 12px; font-family: monospace; letter-spacing: 0.1em;
    opacity: 0;
    animation: mhScore 2400ms ease-out infinite;
    animation-delay: 700ms;
  }
  @keyframes mhScore {
    0%,40%  { opacity: 0; transform: translateY(4px); }
    55%,75% { opacity: 1; transform: translateY(0); }
    90%,100%{ opacity: 0; transform: translateY(-4px); }
  }

  /* ===================================================== */
  /* #10 SHA-256 */
  /* ===================================================== */
  .sha { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; flex-direction: column; gap: 14px; }
  .sha .lbl { font-size: 9px; letter-spacing: 0.3em; color: var(--slate-dim); }
  .sha .row { display: flex; gap: 4px; font-size: 18px; font-family: monospace; letter-spacing: 0.05em; }
  .sha .ch {
    width: 16px; text-align: center;
    color: var(--slate-dim);
    animation: shaScramble 100ms steps(1) infinite, shaLock 2800ms steps(1) infinite;
  }
  .sha .row.sealed .ch { animation: shaScramble 100ms steps(1) infinite; }
  .sha .ring {
    width: 320px; height: 1px; background: linear-gradient(90deg, transparent, var(--teal), transparent);
    opacity: 0;
    animation: shaSeal 2800ms ease-in-out infinite;
  }
  @keyframes shaScramble { /* set via JS textContent */ }
  @keyframes shaLock {
    0%,12%   { color: var(--slate-dim); }
    14%,90%  { color: var(--teal); text-shadow: 0 0 4px var(--teal); }
    92%      { color: var(--coral); text-shadow: 0 0 8px var(--coral); }
    98%,100% { color: var(--slate-dim); text-shadow: none; }
  }
  @keyframes shaSeal {
    0%,85%   { opacity: 0; }
    90%      { opacity: 1; }
    100%     { opacity: 0; }
  }
</style>
</head>
<body>
  <header>
    <h1>CHRONOOS // LOADER CONCEPTS</h1>
    <span class="meta">10 VARIANTS · 400×400 · SEAMLESS LOOP</span>
  </header>

  <div class="grid" id="grid"></div>

<script>
// =====================================================
// Frame helper
// =====================================================
function frame(num, name, meta, inner, status) {
  return `
    <div class="card">
      <div class="frame">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="label"><span class="num">#${String(num).padStart(2,'0')}</span>${name}</div>
        ${inner}
        <div class="status">${status}</div>
      </div>
      <div class="caption"><span class="name">${name}</span><span class="meta">${meta}</span></div>
    </div>
  `;
}

// =====================================================
// SHA-256 character scrambler (live)
// =====================================================
const HEX = "0123456789abcdef";
const shaRow = document.getElementById('shaRow');
const chars = shaRow ? Array.from(shaRow.querySelectorAll('.ch')) : [];
// per-char "locked time" in cycle ms relative to 2800ms loop
const cycle = 2800;
const lockStart = 200;
const lockSpan  = 1500; // 1500ms total to lock all 16
const sealEnd   = 2400; // unlock at 2400ms
const startedAt = performance.now();
const lockedHex = chars.map(()=>HEX[Math.floor(Math.random()*16)]);

function tick(now) {
  const t = (now - startedAt) % cycle;
  chars.forEach((el, i) => {
    const lockAt = lockStart + (i / chars.length) * lockSpan;
    if (t >= lockAt && t < sealEnd) {
      el.textContent = lockedHex[i];
    } else {
      el.textContent = HEX[Math.floor(Math.random()*16)];
    }
    if (t >= sealEnd) {
      // re-roll for next cycle
      lockedHex[i] = HEX[Math.floor(Math.random()*16)];
    }
  });
  requestAnimationFrame(tick);
}
if (chars.length) requestAnimationFrame(tick);
